[project]
name = "agentic-learning"
version = "0.1.0"
description = "Production Agentic AI Engineering Platform"
requires-python = ">=3.12"

dependencies = [
    # Common
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sentence-transformers>=5.6.1",
]

[dependency-groups]

# Local LLM & Prompt Engineering
llm = [
    "openai>=2.46.0",
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
    "tiktoken>=0.13.0",
]

# RAG & Agent Framework
ai = [
    "langchain",
    "langgraph",
]

# REST API
api = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

# Database
database = [
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "redis",
]

# PDF / Document Processing
ingestion = [
    "pymupdf",
]

# Embedding Models
embedding = [
    "sentence-transformers",
]

# Development
dev = [
    "pytest",
    "ruff",
    "mypy",
    "sqlparse",
]
