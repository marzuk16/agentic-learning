[project]
name = "agentic-learning"
version = "0.1.0"
description = "Production Agentic AI Engineering Platform"
requires-python = ">=3.12"

dependencies = [
    # LLM Clients & Tokenization
    "openai>=2.46.0",
    "tiktoken>=0.13.0", # token count

    # Local LLM (Apple Silicon)
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",

    # AI Frameworks
    "langchain",
    "langgraph",

    # Web API
    "fastapi",
    "uvicorn[standard]",

    # Database
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "redis",

    # Configuration & Validation
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]


[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy"
]


[tool.setuptools.packages.find]
where = ["src"]
